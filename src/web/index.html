<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Protocol Tester</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Open Protocol Tester</h1>
        <p>DEPRAG / Open Protocol R1.0 本地 TCP 调试台</p>
      </div>
      <div class="top-connection">
        <div class="status" id="statusBadge">未连接</div>
        <span id="topConnectionTarget">-</span>
        <button type="button" class="secondary mini" id="topEditConnectionBtn">修改连接</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel connection">
        <div class="connection-head">
          <h2>连接</h2>
          <button type="button" class="secondary mini" id="editConnectionBtn">修改连接</button>
        </div>
        <div class="connection-summary" id="connectionSummary">
          <span id="connectionDot" class="dot"></span>
          <strong id="connectionText">未连接</strong>
          <span id="connectionTarget">-</span>
        </div>
        <form id="connectForm" class="grid-form">
          <label>IP / Host <input name="host" value="127.0.0.1"></label>
          <label>端口 <input name="port" type="number" value="4545"></label>
          <label>Profile
            <select name="profile">
              <option>OP R1.0</option>
              <option>OP-Ford R1.0</option>
            </select>
          </label>
          <label>Revision <input name="revision" value="001" maxlength="3"></label>
          <label>Keep alive 秒 <input name="keepAliveSeconds" type="number" value="10" min="0"></label>
          <label class="check"><input name="handshake" type="checkbox" checked> 连接后发送 MID 0001</label>
          <div class="actions">
            <button type="submit">连接</button>
            <button type="button" id="disconnectBtn" class="secondary">断开</button>
          </div>
        </form>
      </section>

      <section class="panel quick">
        <h2>功能命令</h2>
        <div class="quick-grid" id="quickActions"></div>
      </section>

      <div class="side-stack">
        <section class="panel controller-state">
          <div class="state-title">
            <h2>控制器状态</h2>
          </div>
          <div class="state-grid" id="controllerState"></div>
        </section>

        <section class="panel result-panel">
          <h2>拧紧结果</h2>
          <div class="result-tabs" id="resultTabs"></div>
          <div class="result-detail" id="resultDetail"></div>
        </section>
      </div>

      <section class="panel events">
        <div class="event-header">
          <h2>事件日志</h2>
          <div class="event-tools">
            <input id="eventFilter" class="filter" placeholder="过滤 MID / 类型">
            <button id="exportBtn" class="secondary">导出 JSON</button>
            <button id="clearBtn" class="secondary">清空</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>MID</th>
              <th>描述</th>
              <th>Data / Parsed</th>
            </tr>
          </thead>
          <tbody id="eventRows"></tbody>
        </table>
      </section>

      <section class="panel raw-console">
        <h2>手动 MID</h2>
        <form id="rawForm" class="raw-form">
          <label>MID <input name="mid" value="0001" maxlength="4"></label>
          <label>Revision <input name="revision" value="001" maxlength="3"></label>
          <label class="check"><input name="noAck" type="checkbox"> No ack</label>
          <label class="raw-data">Data ASCII <textarea name="rawData" rows="3" placeholder="只填 data 字段，不需要 NUL"></textarea></label>
          <button type="submit">发送 Raw</button>
        </form>
        <details class="schema-details">
          <summary>MID Schema 查询</summary>
          <input id="schemaFilter" class="filter" placeholder="过滤 MID 或描述">
          <div class="schema-list" id="schemaList"></div>
        </details>
      </section>
    </main>

    <div class="modal-backdrop" id="paramModal" hidden>
      <form class="modal" id="paramForm">
        <div class="modal-head">
          <div>
            <h2 id="paramTitle">参数</h2>
            <p id="paramSubtitle"></p>
          </div>
          <button class="icon-button" type="button" data-close-modal>×</button>
        </div>
        <div class="modal-body" id="paramFields"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" data-close-modal>取消</button>
          <button type="submit">发送</button>
        </div>
      </form>
    </div>

    <div class="modal-backdrop" id="curveModal" hidden>
      <div class="modal curve-modal">
        <div class="modal-head">
          <div>
            <h2>曲线数据</h2>
            <p id="curveSubtitle">暂无曲线</p>
          </div>
          <div class="curve-controls">
            <label>主坐标
              <select id="curveMainMode">
                <option value="torque-angle">扭矩 / 角度</option>
                <option value="torque-time">扭矩 / 时间</option>
              </select>
            </label>
            <label>副坐标
              <select id="curveSecondaryMode">
                <option value="none">无</option>
                <option value="speed">速度</option>
                <option value="acceleration">加速度</option>
              </select>
            </label>
          </div>
          <button class="icon-button" type="button" data-close-curve>×</button>
        </div>
        <div class="curve-stage">
          <canvas id="curveCanvas" width="900" height="420"></canvas>
          <div id="curveTooltip" class="curve-tooltip" hidden></div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
